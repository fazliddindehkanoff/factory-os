<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Factory OS — Admin</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #0f1117; color: #e2e8f0; min-height: 100vh; padding: 24px 16px; }
  h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; color: #fff; }
  .sub { font-size: 13px; color: #64748b; margin-bottom: 24px; }
  .card { background: #1e2330; border-radius: 14px; padding: 20px; margin-bottom: 16px; }
  .row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid #2d3348; }
  .row:last-child { border-bottom: none; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; background: #2d3348; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; flex-shrink: 0; }
  .name { flex: 1; }
  .name strong { display: block; font-size: 14px; color: #fff; }
  .name span { font-size: 12px; color: #64748b; }
  select { background: #2d3348; color: #e2e8f0; border: 1px solid #3d4565; border-radius: 8px; padding: 6px 10px; font-size: 13px; cursor: pointer; }
  select:focus { outline: none; border-color: #4f8ef7; }
  .save-btn { background: #4f8ef7; color: #fff; border: none; border-radius: 8px; padding: 6px 14px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .save-btn:hover { background: #3b7de8; }
  .save-btn:disabled { background: #3d4565; cursor: default; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #22c55e; color: #fff; padding: 10px 20px; border-radius: 10px; font-size: 14px; font-weight: 600; opacity: 0; transition: opacity .3s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 20px; font-weight: 600; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 24px; }
  .stat { background: #1e2330; border-radius: 12px; padding: 16px; text-align: center; }
  .stat .val { font-size: 28px; font-weight: 700; color: #4f8ef7; }
  .stat .lbl { font-size: 12px; color: #64748b; margin-top: 4px; }
  .section-title { font-size: 13px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 10px; }
  .role-colors { director: '#1A2B4A' }
  input[type=password] { background: #2d3348; color: #e2e8f0; border: 1px solid #3d4565; border-radius: 8px; padding: 8px 12px; font-size: 14px; width: 100%; margin-top: 8px; }
  input[type=password]:focus { outline: none; border-color: #4f8ef7; }
  label { font-size: 13px; color: #94a3b8; }
  .form-row { margin-bottom: 14px; }
  .err { color: #ef4444; font-size: 12px; margin-top: 6px; }
</style>
</head>
<body>

<h1>⚙️ Factory OS Admin</h1>
<p class="sub">Управление пользователями и ролями · Zelal Tekstil</p>

<div class="stats" id="stats">
  <div class="stat"><div class="val" id="s-reqs">—</div><div class="lbl">Всего заявок</div></div>
  <div class="stat"><div class="val" id="s-pending">—</div><div class="lbl">Ожидают согл.</div></div>
  <div class="stat"><div class="val" id="s-low">—</div><div class="lbl">Мало на складе</div></div>
</div>

<p class="section-title">Пользователи системы</p>
<div class="card" id="users-list">Загрузка...</div>

<p class="section-title" style="margin-top:20px">Установить PIN (для текущего сеанса)</p>
<div class="card">
  <div class="form-row">
    <label>Новый 6-значный PIN</label>
    <input type="password" id="pin-input" maxlength="6" placeholder="••••••" pattern="\d{6}">
    <div class="err" id="pin-err"></div>
  </div>
  <button class="save-btn" onclick="setPin()">Сохранить PIN</button>
</div>

<div class="toast" id="toast"></div>

<script>
const ROLES = {
  requester: 'Заявитель', dept_head: 'Рук. отдела', warehouse: 'Кладовщик',
  procurement: 'Закупки', finance: 'Финансист', director: 'Директор', owner: 'Учредитель'
};
const ROLE_COLORS = {
  requester:'#2D7DD2', dept_head:'#8B5CF6', warehouse:'#1FA363',
  procurement:'#D9820B', finance:'#059669', director:'#1A2B4A', owner:'#E04434'
};

const BASE = window.location.protocol === 'file:' ? 'http://localhost:3000' : '';

function api(path, opts = {}) {
  return fetch(BASE + path, { headers: headers(), ...opts }).then(r => r.json());
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

function headers(extra = {}) {
  const h = { 'Content-Type': 'application/json', ...extra };
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg && tg.initData) h['X-Telegram-Init-Data'] = tg.initData;
  // Privileged dev fallback only on the local machine — never on a deployed origin.
  else if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') h['X-Dev-User-Id'] = 'demo_director';
  return h;
}

async function loadStats() {
  try {
    const s = await api('/api/stats');
    document.getElementById('s-reqs').textContent = s.totalRequests || 0;
    document.getElementById('s-pending').textContent = s.pendingApprovals || 0;
    document.getElementById('s-low').textContent = s.lowStock || 0;
  } catch(e) {}
}

async function loadUsers() {
  const el = document.getElementById('users-list');
  try {
    const users = await api('/api/users');
    if (!Array.isArray(users)) { el.textContent = 'Доступ запрещён (нужна роль Директор/Учредитель)'; return; }
    el.innerHTML = users.map(u => {
      const initials = ((u.first_name||'?')[0] + (u.last_name||'')[0]).toUpperCase();
      const color = ROLE_COLORS[u.role] || '#4f8ef7';
      const opts = Object.entries(ROLES).map(([k,v]) =>
        `<option value="${k}" ${u.role===k?'selected':''}>${v}</option>`).join('');
      return `<div class="row">
        <div class="avatar" style="background:${color}22;color:${color}">${esc(initials)}</div>
        <div class="name">
          <strong>${esc(u.first_name||'')} ${esc(u.last_name||'')}</strong>
          <span>${u.username ? '@'+esc(u.username) : esc(u.telegram_id)}</span>
        </div>
        <select id="role-${u.id}" onchange="markChanged(${u.id})">${opts}</select>
        <button class="save-btn" id="btn-${u.id}" onclick="saveRole(${u.id})" disabled>Сохранить</button>
      </div>`;
    }).join('');
  } catch(e) { el.textContent = 'Ошибка загрузки: ' + e.message; }
}

function markChanged(id) {
  document.getElementById('btn-' + id).disabled = false;
}

async function saveRole(id) {
  const role = document.getElementById('role-' + id).value;
  const btn = document.getElementById('btn-' + id);
  btn.disabled = true; btn.textContent = '...';
  try {
    const r = await api('/api/users/' + id + '/role', { method: 'PATCH', body: JSON.stringify({ role }) });
    if (r.ok) { toast('Роль сохранена: ' + ROLES[role]); btn.textContent = 'Сохранить'; }
    else { toast('Ошибка: ' + (r.error || 'unknown'), true); btn.disabled = false; btn.textContent = 'Сохранить'; }
  } catch(e) { toast('Ошибка сети', true); btn.disabled = false; btn.textContent = 'Сохранить'; }
}

async function setPin() {
  const pin = document.getElementById('pin-input').value;
  const err = document.getElementById('pin-err');
  if (!/^\d{6}$/.test(pin)) { err.textContent = 'PIN должен быть 6 цифр'; return; }
  err.textContent = '';
  try {
    const r = await api('/api/auth/set-pin', { method: 'POST', body: JSON.stringify({ pin }) });
    if (r.ok) { toast('PIN установлен'); document.getElementById('pin-input').value = ''; }
    else toast('Ошибка установки PIN', true);
  } catch(e) { toast('Ошибка сети', true); }
}

function toast(msg, err = false) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.background = err ? '#ef4444' : '#22c55e';
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}

loadStats();
loadUsers();
</script>
</body>
</html>
