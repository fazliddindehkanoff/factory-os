# Factory OS — nginx reverse proxy with HTTPS (Let's Encrypt)
#
# Setup:
#   1. Install nginx + certbot: apt install nginx certbot python3-certbot-nginx
#   2. Replace YOUR_DOMAIN with your real domain
#   3. Copy this to /etc/nginx/sites-available/factory-os
#   4. ln -s /etc/nginx/sites-available/factory-os /etc/nginx/sites-enabled/
#   5. certbot --nginx -d YOUR_DOMAIN
#   6. nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name YOUR_DOMAIN;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name YOUR_DOMAIN;

    # Let's Encrypt will fill these after certbot --nginx
    # ssl_certificate /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Max upload size (base64 attachments)
    client_max_body_size 4m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts for Neon cold start
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
    }
}
